<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LightPhotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f4;
    --ink: #1c1a16;
    --glow: #ffb454;
    --glow-soft: #ffe9c7;
    --muted: #8a8578;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 2rem;
  }

  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(140vw, 1100px);
    height: min(140vw, 1100px);
    transform: translate(-50%, -55%);
    background: radial-gradient(circle, var(--glow-soft) 0%, rgba(255, 233, 199, 0.35) 35%, rgba(255, 233, 199, 0) 65%);
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    animation: bloom 2.4s ease-out 0.15s forwards;
  }

  .wordmark {
    position: relative;
    z-index: 1;
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-size: clamp(3rem, 11vw, 7.5rem);
    font-weight: 560;
    letter-spacing: -0.02em;
    line-height: 1;
    opacity: 0;
    filter: blur(6px);
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  }

  .wordmark .light {
    font-weight: 400;
    font-style: italic;
    background: linear-gradient(100deg, #b8722a 0%, var(--glow) 45%, #b8722a 90%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 3.5s ease-in-out 1.4s 1;
  }

  .slogan {
    position: relative;
    z-index: 1;
    margin-top: 1.4rem;
    font-size: clamp(0.7rem, 1.6vw, 0.85rem);
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
  }

  @keyframes rise {
    from { opacity: 0; filter: blur(6px); transform: translateY(10px); }
    to   { opacity: 1; filter: blur(0);   transform: translateY(0); }
  }

  @keyframes bloom {
    from { opacity: 0; transform: translate(-50%, -55%) scale(0.85); }
    to   { opacity: 1; transform: translate(-50%, -55%) scale(1); }
  }

  @keyframes shimmer {
    from { background-position: 200% 0; }
    to   { background-position: -20% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow, .wordmark, .slogan, .wordmark .light {
      animation: none !important;
      opacity: 1 !important;
      filter: none !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <h1 class="wordmark">Light<span class="light">Photos</span></h1>
    <p class="slogan">Every photo, seen in its best light</p>
  </div>
</body>
</html>
